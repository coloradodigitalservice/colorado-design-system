name: Foundation

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: foundation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.paths.outputs.code }}
      web: ${{ steps.paths.outputs.web }}
      storybook: ${{ steps.paths.outputs.storybook }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - id: paths
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [[ "$EVENT_NAME" == "pull_request" ]]; then
            node scripts/ci-scope.mjs "$BASE_SHA"
          else
            printf 'code=true\nweb=true\nstorybook=true\n' >> "$GITHUB_OUTPUT"
          fi

  repository:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm check:workspace
      - run: pnpm format:check

  code:
    needs: scope
    if: needs.scope.outputs.code == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm validate
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm exec turbo run build --filter='./packages/*' --filter='./examples/*'

  web:
    needs: scope
    if: needs.scope.outputs.web == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm exec turbo run build --filter=@cods-internal/web...
      - run: pnpm exec playwright install --with-deps chromium firefox webkit
      - run: pnpm test:browser --project='web*'
        env:
          CODS_BROWSER_TARGET: web
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: web-preview-${{ github.sha }}
          path: apps/web/dist/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: web-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  storybook:
    needs: scope
    if: needs.scope.outputs.storybook == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc
      - name: Enable pinned pnpm
        run: |
          corepack enable
          corepack prepare pnpm@12.4.2 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm tokens:check
      - run: pnpm lint
      - run: pnpm exec turbo run build --filter=@cods-internal/storybook...
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:browser --project=storybook
        env:
          CODS_BROWSER_TARGET: storybook
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: storybook-preview-${{ github.sha }}
          path: apps/storybook/storybook-static/
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: ${{ !cancelled() }}
        with:
          name: storybook-browser-results-${{ github.sha }}
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  foundation:
    if: always()
    needs: [scope, repository, code, web, storybook]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require all selected jobs to pass
        env:
          RESULTS: ${{ toJSON(needs) }}
        run: |
          node --input-type=module -e '
            const jobs = JSON.parse(process.env.RESULTS);
            for (const [name, job] of Object.entries(jobs)) {
              const selected = ["scope", "repository"].includes(name) || jobs.scope.outputs[name] === "true";
              if (selected && job.result !== "success") process.exit(1);
            }
          '
