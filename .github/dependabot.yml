version: 2
updates:
  # npm/pnpm packages; Dependabot auto-discovers pnpm workspace members from the root directory
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:00'
      timezone: 'America/Denver'
    open-pull-requests-limit: 10
    reviewers:
      - 'coloradodigitalservice/technical-maintainers'
    labels:
      - 'dependencies'
      - 'maintenance'
    commit-message:
      prefix: 'chore(deps):'
      include: 'scope'
    # Dependabot groups match dependency name/type, not directory paths
    groups:
      production-dependencies:
        dependency-type: 'production'
      development-dependencies:
        dependency-type: 'development'
    rebase-strategy: 'auto'

  # GitHub Actions
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
      day: monday
      time: '09:30'
      timezone: 'America/Denver'
    reviewers:
      - 'coloradodigitalservice/technical-maintainers'
    labels:
      - 'dependencies'
      - 'github-actions'
    commit-message:
      prefix: 'ci(actions):'
    rebase-strategy: 'auto'
