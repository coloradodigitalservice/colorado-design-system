<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example embedded video</title>
    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
      }
      video {
        display: block;
        width: 100%;
        height: 100%;
        background: #000;
      }
    </style>
  </head>
  <body>
    <video
      controls
      preload="metadata"
      poster="poster.png"
      aria-label="Example embedded video: blue screen"
    >
      <source src="example.mp4" type="video/mp4" />
      <track
        kind="captions"
        src="captions.vtt"
        srclang="en"
        label="English"
        default
      />
      Your browser does not support video.
    </video>
  </body>
</html>
