<section
  data-cods-fixture-state="default"
  aria-labelledby="checkbox-heading-default"
>
  <h2 id="checkbox-heading-default">Default</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-default"
      type="checkbox"
      name="default"
      value="yes"
    />
    <label
      class="usa-checkbox__label cods-checkbox__label"
      for="checkbox-default"
      >Send me service updates</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="checked"
  aria-labelledby="checkbox-heading-checked"
>
  <h2 id="checkbox-heading-checked">Checked</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-checked"
      type="checkbox"
      name="checked"
      value="yes"
      checked
    />
    <label
      class="usa-checkbox__label cods-checkbox__label"
      for="checkbox-checked"
      >Send me email updates</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="indeterminate"
  aria-labelledby="checkbox-heading-indeterminate"
>
  <h2 id="checkbox-heading-indeterminate">Indeterminate</h2>
  <p>
    JavaScript sets this example to a mixed state. Without JavaScript it is
    unchecked.
  </p>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-indeterminate"
      type="checkbox"
      name="indeterminate"
      value="yes"
    />
    <label
      class="usa-checkbox__label cods-checkbox__label"
      for="checkbox-indeterminate"
      >Some notification channels selected</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="disabled"
  aria-labelledby="checkbox-heading-disabled"
>
  <h2 id="checkbox-heading-disabled">Disabled</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-disabled"
      type="checkbox"
      name="disabled"
      value="yes"
      disabled
    />
    <label
      class="usa-checkbox__label cods-checkbox__label"
      for="checkbox-disabled"
      >Paper notifications unavailable</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="disabled-checked"
  aria-labelledby="checkbox-heading-disabled-checked"
>
  <h2 id="checkbox-heading-disabled-checked">Disabled Checked</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-disabled-checked"
      type="checkbox"
      name="disabled-checked"
      value="yes"
      checked
      disabled
    />
    <label
      class="usa-checkbox__label cods-checkbox__label"
      for="checkbox-disabled-checked"
      >Required service notifications</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="error"
  aria-labelledby="checkbox-heading-error"
>
  <h2 id="checkbox-heading-error">Error</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-error"
      type="checkbox"
      name="error"
      value="yes"
      aria-invalid="true"
      aria-describedby="checkbox-error-message"
      required
    />
    <label class="usa-checkbox__label cods-checkbox__label" for="checkbox-error"
      >I agree to the terms</label
    >
    <p class="cods-checkbox__error" id="checkbox-error-message">
      Error: Agree to the terms before continuing.
    </p>
  </div>
</section>

<section
  data-cods-fixture-state="grouped"
  aria-labelledby="checkbox-heading-grouped"
>
  <h2 id="checkbox-heading-grouped">Grouped</h2>
  <fieldset class="usa-fieldset cods-checkbox__group">
    <legend class="usa-legend cods-checkbox__legend">
      How should we contact you?
    </legend>
    <div class="usa-checkbox cods-checkbox">
      <input
        class="usa-checkbox__input cods-checkbox__input"
        id="checkbox-group-email"
        type="checkbox"
        value="email"
        name="contact"
      />
      <label
        class="usa-checkbox__label cods-checkbox__label"
        for="checkbox-group-email"
        >Email</label
      >
    </div>
    <div class="usa-checkbox cods-checkbox">
      <input
        class="usa-checkbox__input cods-checkbox__input"
        id="checkbox-group-post"
        type="checkbox"
        value="post"
        name="contact"
      />
      <label
        class="usa-checkbox__label cods-checkbox__label"
        for="checkbox-group-post"
        >Postal mail</label
      >
    </div>
  </fieldset>
</section>

<section
  data-cods-fixture-state="long-content"
  aria-labelledby="checkbox-heading-long-content"
>
  <h2 id="checkbox-heading-long-content">Long Content</h2>
  <div class="usa-checkbox cods-checkbox">
    <input
      class="usa-checkbox__input cods-checkbox__input"
      id="checkbox-long"
      type="checkbox"
      name="long"
      value="yes"
    />
    <label class="usa-checkbox__label cods-checkbox__label" for="checkbox-long"
      >Send me detailed updates about service availability, eligibility
      requirements, application deadlines, and opportunities to give feedback on
      Colorado public services.</label
    >
  </div>
</section>

<section
  data-cods-fixture-state="localization"
  aria-labelledby="checkbox-heading-localization"
>
  <h2 id="checkbox-heading-localization">Localization</h2>
  <div lang="es">
    <div class="usa-checkbox cods-checkbox">
      <input
        class="usa-checkbox__input cods-checkbox__input"
        id="checkbox-spanish"
        type="checkbox"
        name="spanish"
        value="yes"
      />
      <label
        class="usa-checkbox__label cods-checkbox__label"
        for="checkbox-spanish"
        >Envíenme actualizaciones sobre los servicios públicos de
        Colorado</label
      >
    </div>
  </div>
</section>

<section data-cods-fixture-state="rtl" aria-labelledby="checkbox-heading-rtl">
  <h2 id="checkbox-heading-rtl">Rtl</h2>
  <div lang="ar" dir="rtl">
    <div class="usa-checkbox cods-checkbox">
      <input
        class="usa-checkbox__input cods-checkbox__input"
        id="checkbox-rtl"
        type="checkbox"
        name="rtl"
        value="yes"
      />
      <label class="usa-checkbox__label cods-checkbox__label" for="checkbox-rtl"
        >أرسلوا لي تحديثات حول الخدمات العامة في كولورادو</label
      >
    </div>
  </div>
</section>
