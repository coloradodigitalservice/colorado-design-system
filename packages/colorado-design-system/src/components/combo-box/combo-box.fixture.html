<div data-cods-fixture-state="default">
  <h2>Default</h2>
  <label class="usa-label cods-combo-box__label" for="combo-year"
    >Select year</label
  >
  <div class="usa-combo-box cods-combo-box" data-cods-combo-box>
    <select
      class="usa-select cods-combo-box__select"
      id="combo-year"
      name="year"
    >
      <option value="">Select a year</option>
      <option value="2026">2026</option>
      <option value="2025">2025</option>
      <option value="2024">2024</option>
    </select>
  </div>
</div>
<div data-cods-fixture-state="disabled">
  <h2>Disabled</h2>
  <label class="usa-label cods-combo-box__label" for="combo-disabled"
    >Select year</label
  >
  <div class="usa-combo-box cods-combo-box" data-cods-combo-box>
    <select
      class="usa-select cods-combo-box__select"
      id="combo-disabled"
      name="disabled-year"
      disabled
    >
      <option value="">Select a year</option>
      <option value="2026">2026</option>
    </select>
  </div>
</div>
