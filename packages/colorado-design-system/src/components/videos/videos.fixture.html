<section data-cods-fixture-state="default">
  <div class="cods-videos">
    <video
      controls
      preload="metadata"
      poster="/videos/poster.png"
      aria-label="Example video: blue screen"
    >
      <source src="/videos/example.mp4" type="video/mp4" />
      <track
        kind="captions"
        src="/videos/captions.vtt"
        srclang="en"
        label="English"
        default
      />
      Your browser does not support video.
    </video>
  </div>
</section>
<section data-cods-fixture-state="embed">
  <div class="cods-videos">
    <iframe
      src="/videos/embedded-example.html"
      title="Example embedded video: blue screen"
      loading="lazy"
      allowfullscreen
    ></iframe>
  </div>
</section>
<section data-cods-fixture-state="four-three">
  <div class="cods-videos cods-videos--four-three">
    <video
      controls
      preload="metadata"
      poster="/videos/poster.png"
      aria-label="Example video: blue screen, 4 to 3"
    >
      <source src="/videos/example.mp4" type="video/mp4" />
      <track
        kind="captions"
        src="/videos/captions.vtt"
        srclang="en"
        label="English"
        default
      />
      Your browser does not support video.
    </video>
  </div>
</section>
