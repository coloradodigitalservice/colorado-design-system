<div data-cods-fixture-state="default">
  <nav
    class="usa-language-container cods-language-selector"
    aria-label="Languages"
  >
    <ul class="usa-list usa-list--unstyled cods-language-selector__links">
      <li>
        <a
          href="https://example.com/en/"
          lang="en"
          hreflang="en"
          aria-current="page"
          >English</a
        >
      </li>
      <li>
        <a href="https://example.com/es/" lang="es" hreflang="es">Español</a>
      </li>
    </ul>
  </nav>
</div>
<div data-cods-fixture-state="multiple-languages">
  <nav
    class="usa-language-container usa-language cods-language-selector"
    aria-label="Languages"
    data-cods-language-selector
  >
    <ul class="usa-language__primary usa-accordion">
      <li class="usa-language__primary-item">
        <button
          type="button"
          class="usa-button usa-language__link cods-language-selector__trigger"
          data-cods-language-selector-trigger
          aria-controls="language-options"
          hidden
        >
          Languages
        </button>
        <ul
          id="language-options"
          class="usa-language__submenu cods-language-selector__panel"
          data-cods-language-selector-panel
        >
          <li class="usa-language__submenu-item">
            <a href="https://example.com/ar/" lang="ar" hreflang="ar"
              >العربية</a
            >
          </li>
          <li class="usa-language__submenu-item">
            <a
              href="https://example.com/en/"
              lang="en"
              hreflang="en"
              aria-current="page"
              >English</a
            >
          </li>
          <li class="usa-language__submenu-item">
            <a href="https://example.com/es/" lang="es" hreflang="es"
              >Español</a
            >
          </li>
          <li class="usa-language__submenu-item">
            <a href="https://example.com/fr/" lang="fr" hreflang="fr"
              >Français</a
            >
          </li>
        </ul>
      </li>
    </ul>
  </nav>
</div>
