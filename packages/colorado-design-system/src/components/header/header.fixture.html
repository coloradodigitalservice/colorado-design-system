<!-- State: default -->
<div data-cods-header-fixture="default" data-cods-fixture-state="default">
  <header class="usa-header usa-header--basic cods-header" data-cods-header>
    <div class="usa-overlay cods-header__overlay"></div>
    <div class="usa-nav-container cods-header__container">
      <div class="usa-navbar cods-header__navbar">
        <div class="usa-logo cods-header__logo">
          <a
            class="cods-header__home"
            href="/"
            aria-label="Colorado Design System home"
          >
            <img
              class="cods-header__logo-image"
              src="/logos/cods-logo.svg"
              alt=""
              width="219"
              height="48"
            />
          </a>
        </div>
        <button
          type="button"
          class="usa-menu-btn cods-header__menu-button"
          aria-controls="cods-header-primary-navigation"
        >
          <svg
            class="cods-icon cods-icon--small"
            aria-hidden="true"
            focusable="false"
            width="16"
            height="16"
            viewBox="0 0 256 256"
          >
            <use href="/icons/sprite.svg#list"></use>
          </svg>
          Menu
        </button>
      </div>
      <nav
        id="cods-header-primary-navigation"
        class="usa-nav cods-header__nav"
        aria-label="Primary"
      >
        <button
          type="button"
          class="usa-nav__close cods-header__close"
          aria-label="Close menu"
        >
          <svg
            class="cods-icon"
            aria-hidden="true"
            focusable="false"
            width="24"
            height="24"
            viewBox="0 0 256 256"
          >
            <use href="/icons/sprite.svg#x"></use>
          </svg>
        </button>
        <ul class="usa-nav__primary usa-accordion cods-header__list">
          <li class="usa-nav__primary-item cods-header__item">
            <a
              class="usa-nav-link usa-current cods-header__link"
              href="https://www.colorado.gov/"
              aria-current="page"
              ><span>Services</span></a
            >
          </li>
          <li class="usa-nav__primary-item cods-header__item">
            <a
              class="usa-nav-link cods-header__link"
              href="https://www.colorado.gov/"
              ><span>Licenses and permits</span></a
            >
          </li>
          <li class="usa-nav__primary-item cods-header__item">
            <a
              class="usa-nav-link cods-header__link"
              href="https://www.colorado.gov/"
              ><span>News</span></a
            >
          </li>
          <li class="usa-nav__primary-item cods-header__item">
            <a
              class="usa-nav-link cods-header__link"
              href="https://www.colorado.gov/"
              ><span>About</span></a
            >
          </li>
        </ul>
      </nav>
    </div>
  </header>
</div>
