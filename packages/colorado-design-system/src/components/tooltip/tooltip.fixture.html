<div data-cods-fixture-state="top">
  <h2>Top</h2>
  <span class="cods-tooltip" data-cods-tooltip
    ><button
      class="usa-button cods-tooltip__trigger"
      type="button"
      data-cods-tooltip-trigger
      data-position="top"
      title="Saves your progress."
    >
      Top
    </button></span
  >
</div>

  <h2>Light</h2>
  <!-- Example surface only: use the light treatment on dark surfaces. -->
  <div
    style="
      background-color: var(--cods-color-bg-page-surface-dark-blue);
      padding: calc(var(--cods-space-lg) * 3) var(--cods-space-lg)
        var(--cods-space-lg);
    "
  >
    <span class="cods-tooltip cods-tooltip--light" data-cods-tooltip

        class="usa-button cods-tooltip__trigger"
